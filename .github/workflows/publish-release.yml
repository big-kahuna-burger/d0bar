name: Publish packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer version to publish, for example 0.1.0 or 0.1.0-preview.0
        required: true
        type: string
      prerelease:
        description: Publish under npm's next tag and create a GitHub prerelease
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish npm release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm-release
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm --filter @d0bar/frame-budget test
      - run: pnpm lint

      - name: Set package versions
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
        run: node scripts/prepare-release.mjs

      - name: Commit and tag release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json packages/signals/package.json packages/frame-budget/package.json
          git commit -m "release: v${RELEASE_VERSION}"
          git tag "v${RELEASE_VERSION}"
          git push origin HEAD:main --follow-tags

      - name: Publish @d0bar/signals
        run: pnpm --filter @d0bar/signals publish --tag ${{ inputs.prerelease && 'next' || 'latest' }} --provenance --no-git-checks --ignore-scripts

      - name: Publish @d0bar/frame-budget
        run: pnpm --filter @d0bar/frame-budget publish --tag ${{ inputs.prerelease && 'next' || 'latest' }} --provenance --no-git-checks --ignore-scripts

      - name: Publish d0bar
        run: pnpm --filter d0bar publish --tag ${{ inputs.prerelease && 'next' || 'latest' }} --provenance --no-git-checks --ignore-scripts

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: gh release create "v${RELEASE_VERSION}" --generate-notes ${{ inputs.prerelease && '--prerelease' || '' }}
