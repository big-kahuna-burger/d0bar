# The three claims readme.md makes about CI, made true.
#
# `readme.md` said "asserted in CI" in three places and `observation-core`'s budget scenario
# said "THEN CI fails", against a repository with no `.github`, no `.gitlab-ci.yml` and no
# `.circleci`. The correction is this file, not an edit to those sentences.
#
# Three jobs, deliberately parallel and deliberately not sharing a runner:
#
#   check            lint (eslint + prettier), size gate, unit tests
#   perf-timing      the seven @timing tests, one worker, alone on the machine
#   perf-behaviour   the other sixty-two, across every core the runner has
#
# The split exists because only the first kind cares who else is running. Measured on one CI
# run: 317 s of the perf suite is timing-sensitive and 158 s is not, and the second 158 s was
# running one test at a time because it shared a config with the first. Each job builds its own
# `dist/` rather than taking one from `check`, so none of them waits on another.
#
# What is cached, and what deliberately is not:
#
#   pnpm store          keyed on the lockfile; `--frozen-lockfile` makes a hit a hardlink pass
#   Playwright browsers keyed on the lockfile, exact match only — a `restore-keys` fallback
#                       would leave a wrong-version browser on disk
#   .cache              eslint's and prettier's own caches, content-keyed (check job only)
#
#   dist/               NOT cached, in any job. Each perf job builds its own. A cache key would
#                       have to enumerate every build input — src, six vite configs, the token
#                       generator, the spark-signals workspace package — and a key that misses
#                       one measures a stale bundle and reports the number as this commit's.
#                       That is the stale-fixture-server bug with a longer feedback loop.
#
# Every action is pinned to a commit SHA with its version in a trailing comment. A tag is a moving
# pointer the upstream owner can repoint at any commit, so `@v4` is a promise about intent rather
# than about bytes; a SHA is the artifact. The comment is what makes the pin readable and what
# Dependabot rewrites when it bumps one.
#
# All five run on Node 24. They were on Node 20 and the runner was force-upgrading them, which is a
# deprecation warning today and a broken workflow when the forcing stops.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Only `check` cancels a superseded run. Its answer is about the tree at a commit and a newer
  # commit makes the older answer worthless, so cancelling costs nothing.
  check:
    runs-on: ubuntu-24.04
    concurrency:
      group: check-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # pnpm only. An `npx` or `npm ci` anywhere in this file would resolve a different tree
      # than the committed `pnpm-lock.yaml`.

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # From `.nvmrc`, so the workflow, the local toolchain and `engines.node` cannot
          # drift apart — three places declaring a version is three places to forget.
          node-version-file: .nvmrc
          # Caches the pnpm content-addressable store, keyed on `pnpm-lock.yaml`. With
          # `--frozen-lockfile` below, a hit makes install a hardlink pass rather than a
          # download.
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # eslint's and prettier's own caches, not a build artifact — both re-hash every file's
      # content (`--cache-strategy content`, because a fresh checkout's mtimes are all new) and
      # a miss simply re-lints. So a stale restore cannot pass a file that would fail.
      #
      # The key covers the two configs and the lockfile; `restore-keys` falls back within the
      # same lockfile, so a config edit starts cold rather than reusing entries whose config
      # hash no longer matches.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: ${{ runner.os }}-lintcache-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.js', '.prettierrc', '.prettierignore') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-lintcache-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.js', '.prettierrc', '.prettierignore') }}-

      - run: pnpm lint

      # `pnpm size` runs the build itself, so the build is not a separate step: a size number
      # measured against anything but the artifacts of this commit is not a size number.
      - run: pnpm size

      - run: pnpm test

  # The observer-effect budget and the six other tests that compare durations. One worker, and
  # nothing else on the runner — which is stricter than it was before this split, when they
  # shared a machine with sixty-two tests that were never part of what they measure.
  #
  # This is the job that produces every number the project quotes. `CLAUDE.md`: CI calibrates
  # and checks, local never does.
  perf-timing:
    runs-on: ubuntu-24.04
    # Keyed on the commit, and never cancelled. A perf run is a *measurement*, and pushing
    # again does not make the previous commit's measurement wrong — it makes it the only record
    # of that commit. Three runs were lost to `cancel-in-progress` in one session, including the
    # one that would have shown what the timing/behaviour split did to wall clock.
    concurrency:
      group: perf-timing-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Playwright's own Chromium, pinned by the `@playwright/test` version in the lockfile
      # rather than by a floating channel.
      #
      # Browser version skew is real and this job does not eliminate it. The bundled Chromium
      # (148), Playwright's Chromium (151) and stable Chrome (152) have different
      # `supportedEntryTypes`, so a green run here says the modern path works — it says nothing
      # about the fallback tiers a user on an older browser gets. Those are covered by unit
      # tests against a stubbed capability set, not here.
      #
      # The browser binary is cached; the system libraries it links against are not, because
      # they are installed into the runner image rather than into a cacheable directory. So a
      # cache hit still runs `install-deps`, which is the cheap half.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - if: steps.playwright.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - if: steps.playwright.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      # The pooled INP sign test's history, carried between runs.
      #
      # A rolling key, because a cache entry is immutable once written: each run restores the most
      # recent history, appends its own decisive pairs and saves under a new key. The file records
      # the stage-1 bundle hash it describes and the test discards it when that changes, so a build
      # is never judged on evidence gathered about a different one.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bench/sign-history.json
          key: ${{ runner.os }}-sign-history-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-sign-history-

      # `bench/fixtures/server.mjs` is started by Playwright's own `webServer` config with
      # `reuseExistingServer: false`, so nothing stale can serve it.
      - run: pnpm test:perf:timing

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: perf-timing-results
          path: |
            bench/last-budget.json
            bench/last-run.json
            bench/sign-history.json
            test-results/
          retention-days: 14
          if-no-files-found: ignore

  # Everything that asserts ordering, DOM state, storage contents or console output. None of it
  # compares two durations, so it takes every core the runner has.
  perf-behaviour:
    runs-on: ubuntu-24.04
    concurrency:
      group: perf-behaviour-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - if: steps.playwright.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - if: steps.playwright.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - run: pnpm test:perf:behaviour

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: perf-behaviour-results
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
