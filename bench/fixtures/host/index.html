<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Northwind Freight — fixture</title>

    <!--
      Captured before anything else runs, so the non-perturbation checks compare against the
      page's genuinely untouched globals rather than against whatever exists at assert time.
    -->
    <script>
      window.__pristine = {
        fetch: window.fetch,
        fetchSource: Function.prototype.toString.call(window.fetch),
        xhrOpen: XMLHttpRequest.prototype.open,
        xhrSend: XMLHttpRequest.prototype.send,
      };
    </script>

    <!--
      The measuring instrument. Identical in both arms — it is not part of what is being
      measured, so it must not differ between them.
    -->
    <script src="/metrics.js"></script>

    <!--
      d0bar, loaded exactly as a host application would: same-origin, deferred, opted in by
      an explicit attribute. `?d0bar=off` omits it entirely; `?d0bar=gated` loads the bundle
      without the attribute, which must leave the page untouched.
    -->
    <script>
      (function () {
        /* `?hostsw=1` gives the *host page* a service worker of its own, registered before
           d0bar loads and knowing nothing about it. That is outcome 3 in `src/collector/sw.ts`:
           the scope is owned by someone else, d0bar must refuse to register, and the whole
           degraded path has to render. Registered here rather than in the module below because
           it has to be the host's, not the toolbar's — and left un-awaited, because a host would
           not block their page on it either. */
        if (new URLSearchParams(location.search).get("hostsw") === "1") {
          if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("/host-sw.js", { scope: "/" }).catch(function () {});
          }
        }
        /* `?slowload=<ms>` holds the fixture's own load event open, so a test can land a click
           while the page is genuinely still loading. Inert unless asked for, like `?live`. */
        var slowload = new URLSearchParams(location.search).get("slowload");
        if (slowload) {
          var hold = document.createElement("script");
          hold.src = "/slow-script.js?delay=" + encodeURIComponent(slowload);
          hold.defer = true;
          document.head.appendChild(hold);
        }
        var arm = new URLSearchParams(location.search).get("d0bar") || "off";
        if (arm === "off") return;
        var script = document.createElement("script");
        script.src = "/dist/d0bar.iife.js";
        script.defer = true;
        if (arm === "on") {
          script.setAttribute("data-d0bar-enabled", "");
          /* Tier 2. Served from the root so the worker's scope covers the whole origin —
             see the `/d0bar-sw.js` route in server.mjs for why that is a constraint and not
             a preference. `?sw=off` runs the `on` arm with tier 2 deliberately absent, which
             is the degraded path the footer has to render honestly. */
          var sw = new URLSearchParams(location.search).get("sw");
          if (sw !== "off") {
            /* `?api=<origin>` exercises the worker's escape hatch for an origin the compiled
               region table does not carry. Not needed to connect — the regions are compiled in
               and picked in the connect surface — so the default arms register the plain URL and
               stay exactly what they were before this change. */
            var api = new URLSearchParams(location.search).get("api");
            script.setAttribute(
              "data-d0bar-sw",
              api ? "/d0bar-sw.js?api=" + encodeURIComponent(api) : "/d0bar-sw.js"
            );
          }
        }
        /* `?region=<id>` preselects the connect surface's region picker, so a debugging session
           against a non-EU tenant does not re-pick it on every reload. An id, not an origin —
           the worker resolves it against its own table and ignores anything else. */
        var region = new URLSearchParams(location.search).get("region");
        if (region) window.D0BAR_REGION = region;
        /* `?shortcut=off` exercises the opt-out that returns the host's event surface to
           untouched — asserted in `non-perturbation.spec.ts`. */
        var shortcut = new URLSearchParams(location.search).get("shortcut");
        if (shortcut) script.setAttribute("data-d0bar-shortcut", shortcut);
        document.head.appendChild(script);
      })();
    </script>

    <!--
      Live reload, for `pnpm dev` only.

      Strictly opt-in via `?live`, and never requested otherwise. The fixture is the measuring
      instrument, not part of what is measured: an EventSource held open for the life of the
      page is a request, a connection and a wakeup source, and letting it run during a
      benchmark would put the harness inside the numbers. The perf suite never passes `live`,
      so this is inert there by construction rather than by discipline.
    -->
    <script>
      (function () {
        if (!new URLSearchParams(location.search).has("live")) return;
        var seenOpen = false;
        var source = new EventSource("/__live");
        source.addEventListener("open", function () {
          /* A reopen means the server restarted under `node --watch`, so the fixture
             itself changed. */
          if (seenOpen) location.reload();
          seenOpen = true;
        });
        source.addEventListener("change", function () {
          location.reload();
        });
      })();
    </script>

    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>

    <main>
      <h1>Shipment #8821 <small>Rotterdam → Duisburg</small></h1>

      <!--
        The LCP element. Filled with large text once a deliberately slow request returns, so
        the page has a poor LCP of its own. Text rather than an image on purpose: Chrome
        excludes low-entropy images from LCP candidacy, and a placeholder PNG is exactly that.
      -->
      <div class="hero-map" id="hero"></div>

      <div class="stats">
        <div class="stat"><span>Legs</span><strong>3</strong></div>
        <div class="stat"><span>Weight</span><strong>18.4 t</strong></div>
        <div class="stat"><span>Quoted</span><strong>€ 4 120</strong></div>
      </div>

      <!-- The layout-shift victim: a row is inserted above this table after load. -->
      <div id="shift-anchor"></div>
      <table class="rates">
        <tbody>
          <tr><td>Line haul · Rotterdam–Duisburg</td><td>€ 2 880</td></tr>
          <tr><td>Terminal handling</td><td>€ 540</td></tr>
          <tr><td>Customs clearance</td><td>€ 280</td></tr>
          <tr><td>Fuel surcharge</td><td>€ 420</td></tr>
        </tbody>
      </table>

      <button id="confirm-hold" class="confirm">Confirm hold</button>
      <p class="synced">Last synced 12:41 · Quote engine v14</p>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
